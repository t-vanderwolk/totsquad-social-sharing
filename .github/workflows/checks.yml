name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check script.js && node --check content.js
      - run: node scripts/validate-content.cjs
      - run: node tests/content.test.cjs
